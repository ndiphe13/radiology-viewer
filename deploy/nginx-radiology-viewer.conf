# /etc/nginx/sites-available/radiology-viewer
# Replace radiology.example.local, certificate paths and the PHP-FPM socket.

# Rate limit for public share links (/s/...): 30 requests/minute per IP, bursts allowed
limit_req_zone $binary_remote_addr zone=share_links:10m rate=30r/m;

server {
    listen 80;
    server_name radiology.example.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name radiology.example.local;

    ssl_certificate     /etc/ssl/certs/radiology.crt;
    ssl_certificate_key /etc/ssl/private/radiology.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Only the public/ folder is exposed. app/, vendor/, writable/ and .env stay private.
    root  /var/www/radiology-viewer/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10m;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/radiology-viewer.access.log;
    error_log  /var/log/nginx/radiology-viewer.error.log;

    # Block hidden files (.env, .git, .htaccess)
    location ~ /\. {
        deny all;
    }

    location /s/ {
        limit_req zone=share_links burst=60 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        # Image conversion of large studies can take a few seconds
        fastcgi_read_timeout 120s;
    }

    location ~* \.(ico|css|js|png|jpg|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
